<title>Bitácora de vuelo</title>
<style>
:root{--bg:#000;--card:#08111f;--ink:#4a90e2;--mut:#3f78b8;--line:#16345f;--acc:#1f6feb;--on:#fff;--hi:#6aa9ff;--bar:#2a7de1;color-scheme:dark;box-sizing:border-box}
html{background:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top,0px)}
.num{font-family:'Avenir Next Condensed','DIN Alternate','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block}
h1{font-size:15px;font-weight:600;margin:4px 0 10px;color:var(--mut)}
.hero{background:#0a2347;color:#6aa9ff;border-radius:14px;padding:18px 18px 14px}
.hero .big{font-size:64px;line-height:1;font-weight:700}
.hero small{opacity:.8;font-size:14px}
.hero .row{display:flex;gap:24px;margin-top:12px}
.hero .row b{font-size:26px;display:block;line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.k b{font-size:26px;display:block;line-height:1.1}.k span{color:var(--mut);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:500}
.tools{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--acc);color:var(--on);font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:transparent;color:#c0392b;border:1px solid #c0392b}
:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.f{display:flex;gap:8px}.f>*{flex:1}
.fl{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bar);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:12px;align-items:center;cursor:pointer}
.fl .d{min-width:44px;text-align:center;line-height:1.05}.fl .d b{font-size:24px;display:block}.fl .d span{font-size:11px;color:var(--mut)}
.fl .m{flex:1;min-width:0}.fl .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fl .m .s{font-size:13px;color:var(--mut)}
.fl .t{font-size:22px;font-weight:700}
.fl.sal{border-left-color:var(--hi)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.tg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#tot{font-size:30px;font-weight:700;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--hi)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:var(--on);padding:8px 14px;border-radius:8px;display:none}
.mut{color:var(--mut);font-size:13px}
.chips.ac{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.box.sub{margin-left:16px;border-left:3px solid var(--bar)}.box.z{opacity:.55}
.box.tot{border-color:var(--bar);background:#0a1a33}
.hw{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}.goal{text-align:right}.goal b{font-size:34px;display:block;line-height:1.1}
.gb{height:6px;background:#16345f;border-radius:3px;margin:12px 0 4px}.gb i{display:block;height:100%;background:#4a90e2;border-radius:3px}
.st{display:flex;flex-direction:column;gap:2px}.st b{font-size:30px}.st small{font-size:13px;font-weight:500}.st span:nth-of-type(2){font-weight:700}
.st.ok{background:#37d67a}.st.wa{background:#f7d23e}.st.or{background:#ff9f2e}.st.rd{background:#ff5a5f}
.st.ok,.st.wa,.st.or,.st.rd{color:#04152b;border-color:transparent}.st.ok span,.st.wa span,.st.or span,.st.rd span{color:#04152b}
.ch{display:flex;justify-content:space-between;align-items:baseline}.ct{font-size:28px}
.cb{height:6px;background:var(--line);border-radius:3px;margin:8px 0}.cb i{display:block;height:100%;background:var(--bar);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut)}.chips b{color:var(--ink);font-size:16px}
</style>
</head>
<body>
<main>
<section id="v-res" class="view on"></section>
<section id="v-fl" class="view">
  <h1>Vuelos</h1>
  <input id="q" type="search" placeholder="Buscar por ruta, misión u observación">
  <div class="tools f"><select id="fy"></select><select id="fm"></select></div>
  <div id="list"></div>
</section>
<section id="v-new" class="view"></section>
</main>
<div id="toast" role="status"></div>
<nav>
  <button data-v="res" class="on">Resumen</button>
  <button data-v="fl">Vuelos</button>
  <button data-v="new">Registrar</button>
</nav>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const SEED=[];
const KEY='bitacora_horus_v1';
const MES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const CARGOS={PI:'Piloto instructor',P:'Piloto',PA:'Piloto alumno',PAL:'Piloto alumno básico',CP:'Copiloto',CPA:'Copiloto alumno',CRM:'Recursos de cabina',CHM:'Chequeador de misión'};
const CON=['VFR tierra','VFR mar','IFR','Nocturno','NVG tierra','NVG mar'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>Math.floor(m/60)+':'+pad(m%60);
const sum=r=>r.t.reduce((a,b)=>a+b,0);
function parseT(s){s=String(s||'').trim().replace(',','.');if(!s)return 0;
  if(s.includes(':')){const[h,m]=s.split(':');return (+h||0)*60+(+m||0)}
  if(s.includes('.'))return Math.round(parseFloat(s)*60)||0;
  if(s.length>2)return (+s.slice(0,-2))*60+(+s.slice(-2));
  return (+s||0)*60}
let S=[];
try{const j=localStorage.getItem(KEY);if(j)S=JSON.parse(j)}catch(e){}
if(!S.length)S=SEED.map(x=>({...x}));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar. Exporta un respaldo.')}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
const sorted=()=>[...S].sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.id-a.id);
const flights=()=>S.filter(r=>!r.sal);
const yr=r=>r.d.slice(0,4);

function renderRes(){
  const tot=S.reduce((a,r)=>a+sum(r),0), tom=S.reduce((a,r)=>a+(r.to||0),0), mis=flights().filter(r=>sum(r)>0).length;
  const by=CON.map((n,i)=>[n,S.reduce((a,r)=>a+r.t[i],0)]).filter(x=>x[1]>0);
  const cg={};S.forEach(r=>{const c=r.c||'Sin cargo';const o=cg[c]||(cg[c]={t:0,v:[0,0,0,0,0,0],ac:{}});r.t.forEach((m,i)=>{o.v[i]+=m;o.t+=m});const k=r.a||'Sin aeronave';o.ac[k]=(o.ac[k]||0)+sum(r)});
  const used=Object.keys(cg).sort((a,b)=>cg[b].t-cg[a].t),zero=Object.keys(CARGOS).filter(c=>!cg[c]);
  const grp=a=>{const v=[0,0,0,0,0,0],ac={};a.forEach(c=>{if(!cg[c])return;cg[c].v.forEach((m,i)=>v[i]+=m);for(const k in cg[c].ac)ac[k]=(ac[k]||0)+cg[c].ac[k]});return{t:v.reduce((x,y)=>x+y,0),v,ac}};
  const gc=grp(['CP','CPA']),gp=grp(['P','PA']),cmax=Math.max(1,...used.map(c=>cg[c].t),gc.t,gp.t);
  const E0={t:0,v:[0,0,0,0,0,0],ac:{}};
  const cbox=(n,s,o,k,lab,mx)=>`<div class="box${k||''}${o.t?'':' z'}"><div class="ch"><div><b>${esc(n)}</b> <span class="mut">${esc(s)}</span></div><b class="num ct">${fmt(o.t)}</b></div><div class="cb"><i style="width:${Math.round(o.t/(mx||cmax)*100)}%"></i></div>${o.t?`<div class="chips">${o.v.map((m,i)=>m?`<span><b class="num">${fmt(m)}</b> ${CON[i]}</span>`:'').join('')}</div><div class="chips ac"><span>${lab||'Aeronave'}:</span>${Object.entries(o.ac).sort((x,y)=>y[1]-x[1]).map(([k,m])=>`<span><b class="num">${fmt(m)}</b> ${esc(k)}</span>`).join('')}</div>`:''}</div>`;
  const one=c=>cbox(c,CARGOS[c],cg[c]||E0),sub=c=>cbox(c,CARGOS[c],cg[c]||E0,' sub');
  const ar={};S.forEach(r=>{const k=r.a||'Sin aeronave';const o=ar[k]||(ar[k]={t:0,v:[0,0,0,0,0,0],ac:{}});r.t.forEach((m,i)=>{o.v[i]+=m;o.t+=m});const c=r.c||'Sin cargo';o.ac[c]=(o.ac[c]||0)+sum(r)});
  const amax=Math.max(1,...Object.values(ar).map(o=>o.t));
  const GOAL=3000*60,falta=Math.max(0,GOAL-tot),pct=Math.min(100,Math.round(tot/GOAL*100));
  const T0=new Date();T0.setHours(0,0,0,0);
  const lf=[[0,'VFR',40],[4,'NVG',40],[1,'VFR mar',180],[5,'NVG mar',180]].map(([i,n,lim])=>{
    const f=flights().filter(r=>r.t[i]>0).sort((a,b)=>a.d<b.d?1:-1)[0];
    if(!f)return `<div class="k st na"><span>${n} · ${lim} días</span><b class="num">—</b><span>Sin vuelos registrados</span></div>`;
    const D=new Date(f.d+'T00:00:00'),dd=Math.max(0,Math.round((T0-D)/864e5)),ds=f.d.slice(8)+' '+MES[+f.d.slice(5,7)-1]+' '+f.d.slice(0,4);
    const E=new Date(D);E.setDate(E.getDate()+lim);const es=pad(E.getDate())+' '+MES[E.getMonth()]+' '+E.getFullYear();
    let c,l;
    if(dd>lim){const m=new Date(D);m.setMonth(m.getMonth()+18);
      l=T0>m?'VENCIDA · Curso completo':'VENCIDA · Recobro '+(dd<=90?'A':dd<=180?'B':dd<=360?'C':'D');c='rd'}
    else{c=dd<=lim*.5?'ok':dd<=lim*.875?'wa':'or';const r=lim-dd;l='Vigente · '+(r===0?'vence hoy':'quedan '+r+(r===1?' día':' días'))}
    return `<div class="k st ${c}"><span>${n} · ${lim} días</span><b class="num">${dd} <small>días sin volar</small></b><span>${l}</span><span>Último vuelo: ${ds}</span><span>${dd>lim?'Venció':'Vence'}: ${es}</span></div>`}).join('');
  const now=new Date(),mo=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);mo.push([d.getFullYear()+'-'+pad(d.getMonth()+1),MES[d.getMonth()]])}
  const mm=mo.map(([k,l])=>[l,S.filter(r=>r.d.slice(0,7)===k).reduce((a,r)=>a+sum(r),0)]);
  const mx=Math.max(60,...mm.map(x=>x[1]));
  const years={},mats={};
  S.forEach(r=>{const y=yr(r);years[y]=(years[y]||0)+sum(r);if(!r.sal)mats[r.m]=(mats[r.m]||0)+sum(r)});
  const last=sorted().find(r=>!r.sal);
  $('#v-res').innerHTML=`<h1>Tiempo total de vuelo</h1>
  <div class="hero"><div class="hw"><div><div class="big num">${fmt(tot)}</div><small>horas acumuladas</small></div><div class="goal"><b class="num">${fmt(falta)}</b><small>${falta?'faltan para 3.000 h':'meta de 3.000 h cumplida'}</small></div></div><div class="gb"><i style="width:${pct}%"></i></div><small>${pct}% de la meta</small>
  <div class="row"><div><b class="num">${mis}</b><small>misiones</small></div><div><b class="num">${tom}</b><small>tomas</small></div>${last?`<div><b class="num">${last.d.slice(8)} ${MES[+last.d.slice(5,7)-1]}</b><small>último vuelo</small></div>`:''}</div></div>
  <h1 style="margin-top:16px">Autonomías de vuelo</h1>
  <div class="grid">${lf}</div>
  <h1 style="margin-top:16px">Total por condición</h1>
  <div class="grid">${by.map(([n,m])=>`<div class="k"><b class="num">${fmt(m)}</b><span>${n}</span></div>`).join('')}</div>
  <h1 style="margin-top:16px">Horas por cargo</h1>
  ${one('PI')}
  ${cbox('Piloto totales','P + PA',gp,' tot')}${sub('P')}${sub('PA')}
  ${cbox('Copiloto totales','CP + CPA',gc,' tot')}${sub('CP')}${sub('CPA')}
  ${one('CRM')}${one('CHM')}${one('PAL')}
  ${used.filter(c=>!CARGOS[c]).map(c=>cbox(c,'Otro cargo',cg[c])).join('')}
  <h1 style="margin-top:16px">Tipo de aeronave</h1>
  ${Object.entries(ar).sort((a,b)=>b[1].t-a[1].t).map(([k,o])=>cbox(k,'',o,'','Cargo',amax)).join('')}
  <div class="box"><b>Últimos 12 meses</b><div class="bars">${mm.map(([l,m])=>`<div title="${fmt(m)}"><i style="height:${Math.round(m/mx*80)}px"></i>${l[0]}</div>`).join('')}</div></div>
  <div class="box"><b>Por año</b><table>${Object.keys(years).sort().reverse().map(y=>`<tr><td>${y}</td><td class="num">${fmt(years[y])}</td></tr>`).join('')}</table></div>
  <div class="box"><b>Por matrícula</b><table>${Object.entries(mats).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<tr><td>${esc(m)}</td><td class="num">${fmt(v)}</td></tr>`).join('')}</table></div>
  <div class="box"><b>Respaldo</b><p class="mut">Los datos viven solo en este dispositivo. Exporta un respaldo con frecuencia.</p>
  <div class="tools"><button id="ej">Exportar JSON</button><button class="alt" id="ec">Exportar CSV</button><button class="alt" id="ei">Importar respaldo</button></div></div>`;
  $('#ej').onclick=()=>dl('bitacora_respaldo_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S),'application/json');
  $('#ec').onclick=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const h=['Fecha','Aeronave','Matrícula','Cargo','Misión','Ruta',...CON,'Total','Tomas','Observaciones'];
    const rows=sorted().reverse().map(r=>[r.d,r.a,r.m,r.c,r.mi,r.r,...r.t.map(fmt),fmt(sum(r)),r.to,r.o].map(q).join(','));
    dl('bitacora.csv','\ufeff'+[h.map(q).join(','),...rows].join('\n'),'text/csv')};
  $('#ei').onclick=()=>$('#imp').click();
}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!Array.isArray(j)||!j.every(r=>r.d&&Array.isArray(r.t)))throw 0;
    if(confirm('Se reemplazarán los '+S.length+' registros actuales por '+j.length+' del respaldo. ¿Continuar?')){S=j;save();renderAll();toast('Respaldo importado')}}
    catch(x){toast('El archivo no es un respaldo válido')}};rd.readAsText(f);e.target.value=''};

function fillFilters(){
  const ys=[...new Set(S.map(yr))].sort().reverse();
  $('#fy').innerHTML='<option value="">Todos los años</option>'+ys.map(y=>`<option>${y}</option>`).join('');
  const ms=[...new Set(flights().map(r=>r.m))].sort();
  $('#fm').innerHTML='<option value="">Todas las matrículas</option>'+ms.map(y=>`<option>${esc(y)}</option>`).join('');
}
let lim=60;
function renderList(){
  const q=$('#q').value.trim().toLowerCase(),y=$('#fy').value,m=$('#fm').value;
  const L=sorted().filter(r=>(!y||yr(r)===y)&&(!m||r.m===m)&&(!q||[r.r,r.mi,r.o,r.m,r.c].join(' ').toLowerCase().includes(q)));
  const tt=L.reduce((a,r)=>a+sum(r),0);
  $('#list').innerHTML=`<p class="mut">${L.length} registros · ${fmt(tt)} h</p>`+L.slice(0,lim).map(r=>`<div class="fl${r.sal?' sal':''}" data-id="${r.id}"><div class="d num"><b>${r.sal?'—':r.d.slice(8)}</b><span>${MES[+r.d.slice(5,7)-1]} ${r.d.slice(2,4)}</span></div>
  <div class="m"><div>${r.sal?'Saldo anterior':esc(r.r||r.mi||'Sin ruta')}</div><div class="s">${esc(r.m)} · ${esc(r.c)}${r.mi&&!r.sal?' · '+esc(r.mi):''}</div></div><div class="t num">${fmt(sum(r))}</div></div>`).join('')
  +(L.length>lim?'<button class="alt" id="more" style="width:100%">Ver más</button>':'');
  document.querySelectorAll('.fl').forEach(e=>e.onclick=()=>{edit(+e.dataset.id)});
  const mb=$('#more');if(mb)mb.onclick=()=>{lim+=60;renderList()};
}
['#q','#fy','#fm'].forEach(s=>$(s).oninput=()=>{lim=60;renderList()});

function edit(id){
  const r=id?S.find(x=>x.id===id):{d:new Date().toISOString().slice(0,10),a:'B-412',m:'',c:'P',mi:'',r:'',t:[0,0,0,0,0,0],to:0,o:''};
  const dl=(id,arr)=>`<datalist id="${id}">${[...new Set(arr.filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  $('#v-new').innerHTML=`<h1>${id?'Editar vuelo':'Registrar vuelo'}</h1>
  <label>Fecha</label><input id="fd" type="date" value="${r.d}">
  <div class="f"><div><label>Aeronave</label><input id="fa" value="${esc(r.a)}"></div><div><label>Matrícula</label><input id="fma" list="dm" value="${esc(r.m)}"></div><div><label>Cargo</label><select id="fc">${[...new Set([...Object.keys(CARGOS),r.c].filter(Boolean))].map(c=>`<option value="${esc(c)}"${c===r.c?' selected':''}>${esc(c)}${CARGOS[c]?' · '+CARGOS[c]:''}</option>`).join('')}</select></div></div>
  <label>Misión</label><input id="fmi" list="dmi" value="${esc(r.mi)}">
  <label>Ruta</label><input id="fr" value="${esc(r.r)}">
  <label>Tiempos (h:mm, por ejemplo 1:30)</label>
  <div class="tg">${CON.map((n,i)=>`<div><span class="mut">${n}</span><input class="ft" inputmode="text" value="${r.t[i]?fmt(r.t[i]):''}" placeholder="0:00"></div>`).join('')}</div>
  <div id="tot" class="num"></div>
  <div class="f"><div><label>Tomas</label><input id="fto" type="number" min="0" value="${r.to||0}"></div></div>
  <label>Observaciones</label><textarea id="fo" rows="2">${esc(r.o)}</textarea>
  ${dl('dm',S.map(x=>x.m))}${dl('dmi',S.map(x=>x.mi))}
  <div class="tools"><button id="sv">Guardar</button><button class="alt" id="cn">Cancelar</button>${id?'<button class="del" id="rm">Eliminar</button>':''}</div>`;
  const upd=()=>{$('#tot').textContent=fmt([...document.querySelectorAll('.ft')].reduce((a,e)=>a+parseT(e.value),0))+' h'};
  document.querySelectorAll('.ft').forEach(e=>e.oninput=upd);upd();
  $('#cn').onclick=()=>show(id?'fl':'res');
  if(id)$('#rm').onclick=()=>{if(confirm('¿Eliminar este vuelo?')){S=S.filter(x=>x.id!==id);save();renderAll();show('fl');toast('Vuelo eliminado')}};
  $('#sv').onclick=()=>{
    const t=[...document.querySelectorAll('.ft')].map(e=>parseT(e.value));
    if(!$('#fd').value)return toast('Falta la fecha');
    if(!t.some(x=>x>0))return toast('Ingresa al menos un tiempo de vuelo');
    const n={id:id||Math.max(0,...S.map(x=>x.id))+1,d:$('#fd').value,a:$('#fa').value.trim(),m:$('#fma').value.trim(),c:$('#fc').value.trim(),mi:$('#fmi').value.trim(),r:$('#fr').value.trim(),t,to:+$('#fto').value||0,o:$('#fo').value.trim()};
    if(r.sal)n.sal=true;
    S=id?S.map(x=>x.id===id?n:x):[...S,n];save();renderAll();show('fl');toast('Vuelo guardado')};
  show('new',true);
}
function show(v,keep){
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='new'&&!keep)edit(0);window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function renderAll(){renderRes();fillFilters();renderList()}
renderAll();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
